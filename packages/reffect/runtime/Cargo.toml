# Check-only crate for the static Rust runtimes reffect emits (LIVE-012). Generated crates
# inline these module bodies; this crate lets rustfmt, clippy and unit tests run on them.
# Its dependencies are the union of every generated crate's, with the union of their features, so
# its Cargo.lock pins each crate a generated build can reach (#41).
[package]
name = "reffect-runtime"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }
ryu-js = { version = "=1.0.3", default-features = false }
tokio = { version = "=1.53.1", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "net",
  "time",
  "sync",
  "signal",
] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json", "ws"] }
hyper = { version = "=1.11.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "server-graceful"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
http-body = "=1.0.1"
url = "=2.5.8"
sqlx = { version = "=0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite-bundled",
  "postgres",
] }
libsqlite3-sys = "=0.37.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
subtle = { version = "=2.6.1", default-features = false }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["rt", "sync"] }

[workspace]
